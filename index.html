<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyApp Download</title>

    <!-- 👇 Add your font link here -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-light: #f5f5f5;
      --bg-dark: #121212;
      --text-light: #121212;
      --text-dark: #ffffff;
      --accent: #084f46;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Poppins", sans-serif;
      background-color:antiquewhite;
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    /* Header */
    header {
      width: 100%;
      padding: 1.2rem 0;
      background: transparent;
      text-align: center;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-light);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .download-text {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: black;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
  display: inline-block;
  width: 130px;
  height: 65px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
        position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: antiquewhite;
  transition: 0.4s;
  border-radius: 50px;
  border: 4px solid rgb(191, 191, 189);
  box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.2);
    }

    .slider:before {
      position: absolute;
  content: "";
  height: 52px;
  width: 52px;
  left: 6px;
  top: 1px;
  bottom: 6px;
  background-color: white;
  border-radius: 50%;
  transition: 0.4s;
  border: 1px solid rgb(191, 191, 189);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    input:checked + .slider {
      background-color: antiquewhite;
    }

    input:checked + .slider:before {
      transform: translateX(32px);
    }

    /* Button */
    .visit-btn {
      display: inline-block;
  padding: 1.2rem 3rem;         /* Bigger and more tappable */
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  background-color: black;
  color: #fff;
  border: none;
  border-radius: 16px;          /* Softer rounded corners */
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  cursor: pointer;
  transition: all 0.3s ease;
    }

    .visit-btn:hover {
      background-color: var(--bg-dark);     /* Slightly darker on hover */
  transform: translateY(-2px);   /* Subtle lift effect */
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
    }
    .visit-btn:active {
  transform: translateY(0);
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
}

    @media (max-width: 600px) {
      header {
        font-size: 1.5rem;
      }

      .download-text {
        font-size: 1.3rem;
      }
  .visit-btn {
    width: 90%;                 /* spans nicely across screen */
    font-size: 1.4rem;
    padding: 1.4rem 0;
    border-radius: 40px;
  }
    .switch {
    width: 170px;  /* same as desktop */
    height: 85px;
  }

  .slider:before {
    height: 70px;
    width: 70px;
    left: 6px;
    bottom: 6px;
    background-color: black;
      
  }

  input:checked + .slider:before {
    transform: translateX(80px);
      background-color: #fff; /* 👈 or keep white */
  }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">betxcircle</div>
  </header>

  <main>
    <div class="download-text">Download for Android</div>
    <div class="toggle-container">
      <label class="switch">
        <input type="checkbox" id="downloadToggle" />
        <span class="slider"></span>
      </label>
    </div>
    <!-- <button class="visit-btn" onclick="window.location.href='https://betxcircle.app'">
      Visit Web App
    </button> -->
  </main>

<script>
  const toggle = document.getElementById('downloadToggle');
  const body = document.body;

  // Create a message element for errors
  const message = document.createElement('p');
  message.style.textAlign = 'center';
  message.style.fontWeight = 'bold';
  message.style.marginTop = '20px';
  document.body.appendChild(message);

  toggle.addEventListener('change', () => {
    const isAndroid = /Android/i.test(navigator.userAgent);

    if (toggle.checked) {
      if (isAndroid) {
        // ✅ Allow Android download
        body.style.backgroundColor = '#c8f7c5'; // soft green
        body.style.color = 'var(--text-light)';
        message.textContent = '';

        // Trigger APK download
        const link = document.createElement('a');
        link.href = 'https://github.com/bond0010732/betxcircleweb/releases/download/v1.0.0/betxcircleApp.apk'; // your APK link
        link.download = 'BetXCircle.apk';
        link.click();
      } else {
        // ❌ Block non-Android devices
        toggle.checked = false; // reset the toggle
        body.style.backgroundColor = '#ffcccc'; // soft red background
        message.textContent = '❌ This download is only available for Android devices.';
        message.style.color = 'red';
        message.style.marginBottom = '200px';
      }
    } else {
      // Revert to normal when toggled off
      body.style.backgroundColor = 'var(--bg-light)';
      body.style.color = 'var(--text-light)';
      message.textContent = '';
    }
  });
</script>

</body>
</html>
