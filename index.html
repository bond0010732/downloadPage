<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Showcase</title>
<style>
    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: #f5f5f7;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 20px;
        min-height: 100vh;
        text-align: center;
    }

    .header {
        margin-bottom: 30px;
    }

    .logo {
        font-size: 40px;
        font-weight: 800;
        color: #111;
        margin-bottom: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .title {
        font-size: 32px;
        font-weight: 800;
        color: #111;
        margin: 10px 0 5px;
    }

    .subtitle {
        font-size: 16px;
        color: #555;
        max-width: 400px;
        margin: 0 auto 25px;
    }

    .hero-container {
        display: flex;
        flex-direction: column; /* stack vertically */
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 20px;
    }

    .screenshot {
        width: 260px;
        border-radius: 32px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        object-fit: cover;
    }

    .buttons-container {
        display: flex;
        gap: 20px;
        flex-wrap: wrap; /* wrap on small screens */
        justify-content: center;
        margin-top: 20px;
    }

    .download-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 20px;
        border-radius: 14px;
        border: 1px solid #ccc;
        background: white;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        transition: 0.2s ease-in-out;
        white-space: nowrap;
        text-decoration: none;
        color: black;
    }

    .download-btn img {
        width: 26px;
        height: 26px;
    }

    .download-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    @media (max-width: 400px) {
        .download-btn {
            flex: 1 1 120px;
            justify-content: center;
        }
        .screenshot {
            width: 200px;
        }
    }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">betxcircle</div>
    <div class="title">Experience the Future of Mobile Play</div>
    <div class="subtitle">Download the app and enjoy a fast, beautiful and seamless experience on any device.</div>
</div>

<!-- HERO WITH SCREENSHOT -->
<div class="hero-container">
    <img class="screenshot" src="/screenshot.png" alt="App Screenshot">

    <!-- DOWNLOAD BUTTONS UNDER IMAGE -->
    <div class="buttons-container">
        <!-- ANDROID BUTTON -->
        <a id="androidBtn" class="download-btn" href="#">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/Android_robot.svg" alt="">
            Android
        </a>

        <!-- APP STORE BUTTON -->
        <a class="download-btn" href="https://apps.apple.com/ng/app/betxcircle/id6751717415">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="">
            App Store
        </a>
    </div>
</div>

<script>
    const androidBtn = document.getElementById('androidBtn');

    androidBtn.addEventListener('click', function(e) {
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;

        // Check if Android
        if (/android/i.test(userAgent)) {
            window.location.href = 'https://github.com/bond0010732/betxcircleweb/releases/download/v1.0.0/betxcircleAndroidapp.apk';
        } else {
            e.preventDefault();
            alert("This app is only available for Android devices.");
        }
    });
</script>

</body>
</html>
